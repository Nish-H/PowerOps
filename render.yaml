# Render.com deployment configuration
services:
  - type: web
    name: scriptmyideas-backend
    env: python
    region: oregon
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: BACK4APP_APPLICATION_ID
        sync: false
      - key: BACK4APP_REST_API_KEY
        sync: false
      - key: BACK4APP_JAVASCRIPT_KEY
        sync: false
      - key: BACK4APP_SERVER_URL
        value: https://parseapi.back4app.com
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
